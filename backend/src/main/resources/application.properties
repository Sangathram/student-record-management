# Server Port (default 8080, supports cloud PORT env var)
server.port=${PORT:8080}

# Datasource configuration (defaults to local H2 file database, overrides via env vars in production)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/studentdb;DB_CLOSE_DELAY=-1}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA and Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Enable H2 Web Console for local testing
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Allowed origins for CORS (defaults to local Vite, override with deployed frontend URL in production)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
