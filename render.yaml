services:
  # Spring Boot Backend Web Service
  - type: web
    name: student-record-backend
    runtime: java
    rootDir: backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/student-record-backend-1.0.0.jar
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

  # React Frontend Static Site
  - type: web
    name: student-record-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: student-record-backend
          property: host
